<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B2FA0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9B4F96;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C08497;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="380" height="380" rx="80" fill="url(#bgGradient)" stroke="#E8D9E8" stroke-width="2"/>

  <!-- P Letter -->
  <g transform="translate(120, 90)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="45" height="220" rx="10" fill="url(#pGradient)"/>
    <!-- Bowl of the P -->
    <path d="M 45 0 
             L 130 0 
             Q 190 0 190 60 
             Q 190 120 130 120 
             L 45 120 
             L 45 75 
             L 125 75 
             Q 145 75 145 60 
             Q 145 45 125 45 
             L 45 45 
             Z" 
          fill="url(#pGradient)"/>
  </g>
</svg>
